spring.application.name=wely-mcp
server.port=8088

# The MCP endpoint and what clients see on connect.
spring.ai.mcp.server.name=wely-calendar
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=ASYNC
# Spelled out even though STREAMABLE is already the field's default: the WebFlux transport's
# condition is @ConditionalOnProperty(protocol=STREAMABLE) with no matchIfMissing, so without this
# line no route is registered at all -- the server starts, logs "Registered tools", and answers 404.
spring.ai.mcp.server.protocol=STREAMABLE

# The URL clients reach this service at. It goes into the OAuth discovery document, so it must
# be the public one, not the in-cluster Service name.
mcp.public-url=${MCP_PUBLIC_URL}

# Where the calendar lives. The caller's own token is relayed, so no credentials of our own.
gateway.url=${GATEWAY_URL}

# Two-step JWT validation, as in every other service: keys from inside the cluster,
# issuer checked against the public URL the token was minted with.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_JWK_SET_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

# Audience validation, off until Keycloak actually puts an aud claim in the tokens. Checked on
# 2026-10-23: a real token carries none, even though wely-identity's realm export declares an
# audience mapper on business-scope -- the live dev realm has drifted from the export. Setting this
# before the claim exists would answer 401 to every call, so the order is: fix the realm, see the
# claim appear, then set JWT_AUDIENCES here.
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCES:}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
